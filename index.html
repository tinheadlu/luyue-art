<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lu Yue</title>
<meta name="description" content="Lu Yue — painting, printmaking, installation, digital and AI art.">
<style>
:root{--bg:#f5f4f1;--ink:#1c1c1c;--muted:#777772;--line:rgba(28,28,28,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}
.landing{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}.portal{position:relative;width:min(68vw,560px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;isolation:isolate;-webkit-mask-image:radial-gradient(circle closest-side,#000 0 67%,#000f 72%,#000b 81%,#0005 91%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 0 67%,#000f 72%,#000b 81%,#0005 91%,transparent 100%)}.layer{position:absolute;inset:-7%;background-position:center;background-size:cover;transform:scale(1.12)}.blur-layer{filter:blur(31px) saturate(.72);opacity:0;transition:opacity 1.4s ease}.blur-layer.active{opacity:1}.sharp-layer{opacity:0;transition:opacity .7s ease,transform .8s ease;-webkit-mask-image:radial-gradient(circle closest-side,#000 0 48%,#000f 55%,#000b 67%,#0004 79%,transparent 91%);mask-image:radial-gradient(circle closest-side,#000 0 48%,#000f 55%,#000b 67%,#0004 79%,transparent 91%)}.sharp-layer.current{z-index:2}.name{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(24px,4vw,44px);font-weight:300;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 14px #0004;z-index:3}@media(hover:hover){.portal:hover .sharp-layer.current{opacity:1;transform:scale(1.02)}}.portal.is-focused .sharp-layer.current{opacity:1!important;transform:scale(1.02)}
.main{padding:34px 5vw 90px}.topbar{display:flex;justify-content:space-between;gap:24px}.brand{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:16px;font-weight:300;letter-spacing:.34em;text-decoration:none}.nav{display:flex;gap:28px}.nav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}.intro{margin-top:clamp(90px,16vh,180px)}.intro h1{margin:0;color:#d9d8d4;font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:.05em}.categories{margin-top:clamp(55px,9vh,100px);border-top:1px solid var(--line)}.category{display:grid;grid-template-columns:1fr auto;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}.category-title{font-size:clamp(24px,4.3vw,56px);font-weight:300}.category-no{font-size:11px;color:var(--muted)}.category.active{border-bottom:0}
.viewer{display:none;border-bottom:1px solid var(--line);padding:14px 0 38px}.viewer.open{display:block}.viewer-meta{display:flex;justify-content:flex-end;margin-bottom:8px}.viewer-count{font-size:10px;letter-spacing:.16em;color:var(--muted)}.stage{position:relative;min-height:68vh;display:flex;align-items:center;justify-content:center;padding:10px 70px 20px;overflow:hidden}.stage img{display:block;max-width:min(100%,1100px);max-height:70vh;width:auto;height:auto;object-fit:contain;cursor:zoom-in;transform:scale(1);transform-origin:50% 50%;transition:transform .22s ease;touch-action:none;user-select:none;-webkit-user-drag:none}.stage img.zoomed{transform:scale(2.35);cursor:zoom-out}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font-size:48px;font-weight:200;line-height:1;padding:18px;cursor:pointer;z-index:3}.arrow.prev{left:0}.arrow.next{right:0}.close{display:block;margin:8px auto 0;border:0;background:transparent;padding:8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.about-section{display:none;margin-top:34px;padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);grid-template-columns:minmax(90px,.45fr) minmax(280px,1.15fr);gap:40px;align-items:start}.about-section.open{display:grid}.about-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.about-copy{max-width:650px;font-weight:300}.about-name{margin:0 0 8px;font-size:clamp(26px,2.8vw,36px);line-height:1.2}.about-text{margin:0;color:var(--ink);font-size:clamp(16px,1.5vw,20px);line-height:1.55}.footer{padding-top:80px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){.landing{min-height:0;padding:110px 24px 38px}.portal{width:min(84vw,430px)}.name{font-size:24px}.main{padding:24px 24px 60px}.nav{gap:16px}.intro{margin-top:120px}.intro h1{font-size:36px}.categories{margin-top:58px}.category{padding:20px 0}.viewer{padding:10px 0 26px}.stage{min-height:58vh;padding:8px 42px 14px}.stage img{max-width:100%;max-height:60vh}.stage img.zoomed{transform:scale(2.6)}.arrow{font-size:38px;padding:12px}.arrow.prev{left:-8px}.arrow.next{right:-8px}.about-section{grid-template-columns:1fr;gap:18px;margin-top:24px}.about-name{font-size:28px}.about-text{font-size:15px;line-height:1.5}}
</style>
</head>
<body>
<section class="landing" id="top"><button class="portal" id="portal" aria-label="Open current artwork"><span class="layer blur-layer active" id="home-blur-a"></span><span class="layer blur-layer" id="home-blur-b"></span><span class="layer sharp-layer current" id="home-sharp-a"></span><span class="layer sharp-layer" id="home-sharp-b"></span><span class="name">LU YUE</span></button></section>
<main class="main"><header class="topbar"><a class="brand" href="#top">卢 悦</a><nav class="nav"><a href="#works" id="works-link">Works</a><a href="#about" id="about-link">About</a></nav></header>
<section class="intro"><h1>Works</h1></section>
<section class="categories" id="works"><a class="category" href="#" data-set="painting"><span class="category-title">Painting</span><span class="category-no">绘画</span></a><a class="category" href="#" data-set="printmaking"><span class="category-title">Printmaking</span><span class="category-no">版画</span></a><a class="category" href="#" data-set="installation"><span class="category-title">Installation</span><span class="category-no">装置</span></a><a class="category" href="#" data-set="digital-ai"><span class="category-title">Digital &amp; AI</span><span class="category-no">数字与AI</span></a></section>
<section class="viewer" id="viewer"><div class="viewer-meta"><span class="viewer-count" id="viewer-count"></span></div><div class="stage"><button class="arrow prev" id="prev" aria-label="Previous artwork">‹</button><img id="viewer-image" alt="Lu Yue artwork"><button class="arrow next" id="next" aria-label="Next artwork">›</button></div><button class="close" id="close-viewer">Close</button></section>
<section class="about-section" id="about"><div class="about-title">About</div><div class="about-copy"><p class="about-name">Lu Yue</p><p class="about-text">painting, printmaking, installation, digital and AI art.</p></div></section>
<footer class="footer">Artist · Lu Yue &nbsp; © 2026</footer></main>
<script>
const $=s=>document.querySelector(s),portal=$('#portal'),about=$('#about'),viewer=$('#viewer'),img=$('#viewer-image'),count=$('#viewer-count');
function scrollToEl(el){el?.scrollIntoView({behavior:'smooth',block:'start'})}
function closeAbout(){about.classList.remove('open')}
$('#about-link').addEventListener('click',e=>{e.preventDefault();const open=!about.classList.contains('open');closeViewer(false);about.classList.toggle('open',open);if(open)requestAnimationFrame(()=>scrollToEl(about));else scrollToEl($('#works'))});
$('#works-link').addEventListener('click',e=>{e.preventDefault();closeAbout();scrollToEl($('#works'))});
$('.brand').addEventListener('click',e=>{e.preventDefault();closeAbout();scrollToEl($('#top'))});
let sets={painting:[],printmaking:[],installation:[],"digital-ai":[]},currentSet=null,index=0,zoomed=false,activeCategory=null;
function resetZoom(){zoomed=false;img.classList.remove('zoomed');img.style.transformOrigin='50% 50%'}
function render(){resetZoom();const files=sets[currentSet]||[];if(!files.length)return;img.src=files[index];img.alt=`Lu Yue ${currentSet} artwork ${index+1}`;count.textContent=`${String(index+1).padStart(2,'0')} / ${String(files.length).padStart(2,'0')}`}
function closeViewer(scroll=false){resetZoom();viewer.classList.remove('open');activeCategory?.classList.remove('active');activeCategory=null;currentSet=null;if(scroll)scrollToEl($('#works'))}
function openSet(a,startIndex=0,allowToggle=true){closeAbout();const name=a.dataset.set,files=sets[name]||[];if(!files.length)return;if(allowToggle&&activeCategory===a&&viewer.classList.contains('open')){closeViewer();return}activeCategory?.classList.remove('active');activeCategory=a;a.classList.add('active');currentSet=name;index=Math.max(0,Math.min(startIndex,files.length-1));a.insertAdjacentElement('afterend',viewer);viewer.classList.add('open');render();requestAnimationFrame(()=>scrollToEl(a))}
document.querySelectorAll('.category').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openSet(a,0,true)}));
$('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));$('#close-viewer').addEventListener('click',()=>closeViewer(true));
function step(dir){const files=sets[currentSet]||[];if(files.length){index=(index+dir+files.length)%files.length;render()}}
function setOrigin(x,y){const r=img.getBoundingClientRect();img.style.transformOrigin=`${Math.max(0,Math.min(100,(x-r.left)/r.width*100))}% ${Math.max(0,Math.min(100,(y-r.top)/r.height*100))}%`}
function toggleZoom(x,y){zoomed=!zoomed;if(zoomed){setOrigin(x,y);img.classList.add('zoomed')}else resetZoom()}
let down=false,sx=0,sy=0,moved=false;img.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;img.setPointerCapture?.(e.pointerId);if(zoomed)setOrigin(e.clientX,e.clientY)});img.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>7)moved=true;if(zoomed){e.preventDefault();setOrigin(e.clientX,e.clientY)}});img.addEventListener('pointerup',e=>{if(!down)return;down=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(zoomed){if(!moved)toggleZoom(e.clientX,e.clientY);return}if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){step(dx>0?-1:1);return}if(!moved)toggleZoom(e.clientX,e.clientY)});img.addEventListener('pointercancel',()=>down=false);img.addEventListener('mousemove',e=>{if(zoomed&&!down)setOrigin(e.clientX,e.clientY)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(about.classList.contains('open'))closeAbout();else if(zoomed)resetZoom();else closeViewer()}else if(viewer.classList.contains('open')&&!zoomed&&e.key==='ArrowLeft')step(-1);else if(viewer.classList.contains('open')&&!zoomed&&e.key==='ArrowRight')step(1)});
const blur=[$('#home-blur-a'),$('#home-blur-b')],sharp=[$('#home-sharp-a'),$('#home-sharp-b')];let homeItems=[],homePos=-1,homeCurrent=null,homeSlot=0,homeTimer=null,homeFocused=false;
function shuffleHome(){homeItems=[];Object.keys(sets).forEach(set=>(sets[set]||[]).forEach((src,i)=>homeItems.push({set,index:i,src})));for(let i=homeItems.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[homeItems[i],homeItems[j]]=[homeItems[j],homeItems[i]]}homePos=-1}
function showNextHome(){if(!homeItems.length)return;homeFocused=false;portal.classList.remove('is-focused');homePos=(homePos+1)%homeItems.length;homeCurrent=homeItems[homePos];const next=homeSlot,old=1-homeSlot,url=`url('${homeCurrent.src}')`;blur[next].style.backgroundImage=url;sharp[next].style.backgroundImage=url;sharp[old].classList.remove('current');sharp[next].classList.add('current');requestAnimationFrame(()=>{blur[next].classList.add('active');blur[old].classList.remove('active')});homeSlot=old}
function resetHomeTimer(){clearInterval(homeTimer);homeTimer=setInterval(showNextHome,7000)}
function startHome(){shuffleHome();blur.forEach(x=>x.classList.remove('active'));sharp.forEach(x=>x.classList.remove('current'));homeSlot=0;showNextHome();resetHomeTimer()}
portal.addEventListener('click',e=>{if(!homeCurrent)return;const touch=matchMedia('(hover:none)').matches||matchMedia('(pointer:coarse)').matches;if(touch&&!homeFocused){e.preventDefault();homeFocused=true;portal.classList.add('is-focused');resetHomeTimer();return}const a=$(`.category[data-set="${homeCurrent.set}"]`);if(a)openSet(a,homeCurrent.index,false)});
fetch('images.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(data?.painting&&data?.printmaking&&data?.installation&&data?.['digital-ai']){sets=data;startHome()}}).catch(()=>{});
</script>
</body></html>
